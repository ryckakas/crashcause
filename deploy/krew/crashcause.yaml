# krew plugin manifest for crashcause (`kubectl crashcause`).
#
# STATUS: not yet published to the krew index
# (https://github.com/kubernetes-sigs/krew-index). This file is
# hand-maintained here for local installs
# (`kubectl krew install --manifest=deploy/krew/crashcause.yaml`), is attached
# to each GitHub Release as `crashcause.yaml` with its placeholders filled in
# (which is what the README's `--manifest-url` install line fetches), and is
# the basis for a future krew-index submission.
#
# ---------------------------------------------------------------------------
# RELEASE AUTOMATION CONTRACT
# ---------------------------------------------------------------------------
# .goreleaser.yaml deliberately does NOT use goreleaser's `krews:` publisher
# (its availability varies across goreleaser versions); this manifest is the
# single source of truth instead. Exactly three kinds of field are
# release-time placeholders, and nothing else in this file needs to change
# between releases:
#
#   1. spec.version              -> the release tag, e.g. v0.1.0
#   2. every platforms[].uri     -> the "v0.0.0" and "0.0.0" segments become
#                                   the tag and the bare version
#   3. every platforms[].sha256  -> 64 hex chars, taken from the release's
#                                   crashcause_<version>_checksums.txt
#
# In the placeholder form of this file those sha256 values are 64 zeros: a
# well-formed but never-matching digest, so an accidental install from an
# un-rewritten manifest FAILS the checksum check rather than silently
# installing something. Do not "fix" them by shortening or removing them.
# The copy on the default branch is the rewritten form, carrying the real
# digests of the newest release.
#
# Rewrite recipe, starting from the placeholder form of this file (i.e. the
# previous release's manifest reverted, or `git show <prev-tag>:` of it), given
# TAG=v0.1.0 and the downloaded checksums.txt.
#
# Every pattern is ANCHORED to its leading indentation on purpose: the
# unanchored forms (`s/version: v0.0.0/`, `s|/download/v0.0.0/|`) also match
# this very comment block, so running them rewrites the recipe itself and the
# next release starts from mangled instructions. Comment lines begin with `#`,
# so anchoring on the YAML indent can never hit them.
#
#   VERSION="${TAG#v}"
#   sed -i "s|^  version: v0\.0\.0|  version: ${TAG}|" deploy/krew/crashcause.yaml
#   sed -i "s|^\(      uri: .*\)/download/v0\.0\.0/|\1/download/${TAG}/|" deploy/krew/crashcause.yaml
#   sed -i "s|^\(      uri: .*\)crashcause_0\.0\.0_|\1crashcause_${VERSION}_|" deploy/krew/crashcause.yaml
#   # then, per platform, replace the zeros on the `sha256:` line following
#   # each `uri:` with that archive's digest from
#   # crashcause_${VERSION}_checksums.txt - match on the archive FILENAME, not
#   # on ordering, so a reordered platform list cannot pair a digest with the
#   # wrong platform.
#   gh release upload "${TAG}" deploy/krew/crashcause.yaml
#
# The rewritten manifest is committed back to main (so the checked-out copy
# always describes the newest release) AND uploaded as a release asset (so the
# `--manifest-url` install path resolves). This is still a manual post-release
# step; automating it inside the release workflow is tracked for milestone 9.
#
# The `uri` filenames MUST stay in sync with the archive `name_template` in
# ../../.goreleaser.yaml ("crashcause_{{ .Version }}_{{ .Os }}_{{ .Arch }}",
# format tar.gz). The platform matrix below mirrors that file's
# goos x goarch matrix exactly: linux and darwin, amd64 and arm64. There is
# no windows build, so there is deliberately no windows selector here.
apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: crashcause
spec:
  version: v0.1.0
  homepage: https://github.com/ryckakas/crashcause
  shortDescription: Explain why a Kubernetes pod crashed
  description: |
    Answers "why did this pod crash?" without the usual ritual of
    kubectl describe + kubectl logs --previous + digging through events.

    crashcause pulls the pod's spec and status, its events, the previous
    container's log tail, and the node's conditions straight from the
    cluster API - nothing to copy, nothing to paste - and classifies the
    crash into a stable cause code with confidence, the concrete evidence
    it used, and suggested next steps.

    Cause codes include oom_killed, sigkill_unattributed, evicted,
    probe_liveness_failure, probe_startup_failure, image_pull_auth,
    image_pull_not_found, image_pull_other, security_context_violation,
    config_missing_reference, volume_mount_failure, init_container_failure,
    init_container_stuck, unschedulable, app_exit_nonzero,
    sigkill_after_grace and completed_restart_loop.

    Usage:

      kubectl crashcause inspect <pod> -n <namespace>
      kubectl crashcause inspect <pod> -n <namespace> --output json

    Exit codes: 0 diagnosed, 2 nothing to diagnose (the pod is not
    crashing), 1 error.

    inspect runs entirely with your own kubeconfig credentials and needs no
    in-cluster component. The same binary also has a `watch` mode - a
    controller that turns crash causes into Prometheus labels and
    structured log lines - which is deployed separately via the Helm chart
    in the repository, not through this plugin.

    An optional AI log-summarization layer (--ai) is available, off by
    default, bring-your-own-key, with ollama supported for setups where no
    data may leave the machine.
  caveats: |
    This is a pre-1.0 build. `kubectl crashcause inspect` is the supported
    entry point; some cause codes and the in-cluster `watch` mode are still
    being finished. Report anything that misdiagnoses at
    https://github.com/ryckakas/crashcause/issues.
  platforms:
    - selector:
        matchLabels:
          os: darwin
          arch: amd64
      uri: https://github.com/ryckakas/crashcause/releases/download/v0.1.0/crashcause_0.1.0_darwin_amd64.tar.gz
      sha256: "fe8bc0f3e9076bfcdc364bf464e04b90377030d34a8b53acf6d5df01f51debd4"
      bin: crashcause
      files:
        - from: crashcause
          to: .
        - from: LICENSE
          to: .

    - selector:
        matchLabels:
          os: darwin
          arch: arm64
      uri: https://github.com/ryckakas/crashcause/releases/download/v0.1.0/crashcause_0.1.0_darwin_arm64.tar.gz
      sha256: "6232dd5adc3ff57608db16c55f9ae323513500a1b5b0f7eb23842d96919b750e"
      bin: crashcause
      files:
        - from: crashcause
          to: .
        - from: LICENSE
          to: .

    - selector:
        matchLabels:
          os: linux
          arch: amd64
      uri: https://github.com/ryckakas/crashcause/releases/download/v0.1.0/crashcause_0.1.0_linux_amd64.tar.gz
      sha256: "49279f4667bd5325da9804e2469f9ad2a298093925512fb1862447116d98aeb5"
      bin: crashcause
      files:
        - from: crashcause
          to: .
        - from: LICENSE
          to: .

    - selector:
        matchLabels:
          os: linux
          arch: arm64
      uri: https://github.com/ryckakas/crashcause/releases/download/v0.1.0/crashcause_0.1.0_linux_arm64.tar.gz
      sha256: "c77a7e47049d10ee1da0b39786b66fa31b059d1552162553bbdd80990342109c"
      bin: crashcause
      files:
        - from: crashcause
          to: .
        - from: LICENSE
          to: .
