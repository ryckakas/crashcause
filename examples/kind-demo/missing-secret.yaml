# Expected cause code: config_missing_reference
#
# Mechanism: envFrom references a Secret named `does-not-exist-secret`
# that is deliberately never created in this directory. `optional` is left
# unset (defaults to false), so the kubelet cannot resolve the environment
# source and never even starts the container process; the container status
# shows `waiting.reason=CreateContainerConfigError` with a message naming
# the missing secret. The pod never reaches Running.
apiVersion: v1
kind: Pod
metadata:
  name: missing-secret-demo
  namespace: crashcause-demo
  labels:
    app.kubernetes.io/part-of: crashcause-demo
    crashcause.dev/scenario: config-missing-reference
spec:
  restartPolicy: Always
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      envFrom:
        - secretRef:
            name: does-not-exist-secret
            # optional deliberately omitted (defaults to false) so this
            # fails loudly instead of silently starting with no env vars.
