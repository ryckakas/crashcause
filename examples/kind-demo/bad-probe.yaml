# Expected cause code: probe_liveness_failure
#
# Mechanism: the container itself just sleeps and never exits on its own.
# The liveness probe does an HTTP GET against port 9999, which nothing in
# this container listens on (busybox is not running a web server), so every
# probe attempt fails with connection refused. With
# initialDelaySeconds=5, periodSeconds=5, failureThreshold=2,
# timeoutSeconds=1, the kubelet marks the container unhealthy roughly
# 5s + 2*5s = ~15s after start, emits Unhealthy/Killing events, and kills +
# restarts the container. Because only the probe is broken (the process
# would otherwise run forever), the restart is unambiguously probe-caused.
apiVersion: v1
kind: Pod
metadata:
  name: bad-probe-demo
  namespace: crashcause-demo
  labels:
    app.kubernetes.io/part-of: crashcause-demo
    crashcause.dev/scenario: probe-liveness-failure
spec:
  restartPolicy: Always
  containers:
    - name: sleeper
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      livenessProbe:
        httpGet:
          path: /healthz
          port: 9999
        initialDelaySeconds: 5
        periodSeconds: 5
        timeoutSeconds: 1
        failureThreshold: 2
