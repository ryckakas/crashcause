{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "crashcause.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "crashcause.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The controller never needs to talk to the API server as anyone but itself,
# and it never mints tokens for anything else, so the projected token is not
# auto-mounted anywhere except its own pod (see the Deployment).
automountServiceAccountToken: true
{{- end }}
