apiVersion: v2
name: crashcause
description: >-
  Runs crashcause in watch mode: classifies why pods crash and exposes the
  cause as a Prometheus label, a structured stdout log line, or a Loki stream.
type: application

# Both values are deliberate 0.0.0-dev placeholders: the release workflow
# stamps the real version and appVersion (the default image tag) from the
# git tag at `helm package` time, and fails the release if a hardcoded
# version sneaks back in here. When installing from a checkout, set
# image.tag to a released version.
version: 0.0.0-dev
appVersion: "0.0.0-dev"

kubeVersion: ">=1.23.0-0"

home: https://github.com/ryckakas/crashcause
sources:
  - https://github.com/ryckakas/crashcause
keywords:
  - kubernetes
  - crashloopbackoff
  - troubleshooting
  - diagnostics
  - observability
  - prometheus
maintainers:
  - name: ryckakas
    url: https://github.com/ryckakas
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/operator: "false"
