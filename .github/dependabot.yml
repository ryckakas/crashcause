# Weekly dependency updates, per the project spec (§8a): one tool, weekly
# cadence, covering both the Go module graph and the pinned GitHub Actions.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      # k8s.io modules must move in lockstep (client-go/api/apimachinery/
      # cli-runtime share a version train); one grouped PR keeps them
      # mutually compatible instead of four conflicting ones.
      kubernetes:
        patterns:
          - "k8s.io/*"
      golang-x:
        patterns:
          - "golang.org/x/*"
    ignore:
      # The k8s.io v0.36+ train requires Go 1.26, but golangci-lint has no
      # go1.26-built release yet (latest v2.12.2 is built with go1.25), so
      # adopting it would break the required Lint job. Hold the k8s train at
      # v0.35.x; drop this ignore once golangci-lint supports Go 1.26.
      - dependency-name: "k8s.io/*"
        versions: [">=0.36.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
