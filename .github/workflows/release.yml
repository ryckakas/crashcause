name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  goreleaser:
    permissions:
      contents: write  # create the GitHub release and upload assets
      packages: write  # push images/manifests to ghcr.io
      id-token: write  # available for SBOM/attestation signing
    name: GoReleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0  # goreleaser needs full history/tags for the changelog

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: docker/setup-qemu-action@v4.3.0

      - uses: docker/setup-buildx-action@v4.3.0

      - name: Log in to ghcr.io
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # .goreleaser.yaml enables `sboms`, which shells out to syft. Install
      # it explicitly so the release doesn't fail looking for it on PATH.
      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0.24.2

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The chart is distributed as an OCI artifact rather than a classic HTTP
  # chart repository: no gh-pages branch and no index.yaml to keep consistent,
  # and it reuses the ghcr credentials this workflow already needs. Gated on
  # the goreleaser job so a chart is never published pointing at an image tag
  # that failed to build.
  chart:
    name: Publish Helm chart
    needs: goreleaser
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # push the chart artifact to ghcr.io
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: azure/setup-helm@v5.0.1
        with:
          version: v4.2.3

      # Chart.yaml carries 0.0.0-dev placeholders; the real version and
      # appVersion (the image tag the chart defaults to) are stamped from the
      # git tag at package time below, so a release never needs a hand-bumped
      # Chart.yaml. The check keeps that convention honest: a real version
      # hardcoded back into the file would be invisible here (the --version
      # flags win) but would break the from-checkout story the chart README
      # documents.
      - name: Verify Chart.yaml still carries the 0.0.0-dev placeholders
        run: |
          set -euo pipefail
          chart_version="$(helm show chart charts/crashcause \
            | sed -n 's/^version:[[:space:]]*//p')"
          app_version="$(helm show chart charts/crashcause \
            | sed -n 's/^appVersion:[[:space:]]*"\{0,1\}\([^"]*\)"\{0,1\}[[:space:]]*$/\1/p')"
          if [ "$chart_version" != "0.0.0-dev" ] || [ "$app_version" != "0.0.0-dev" ]; then
            echo "FAIL: Chart.yaml must keep the 0.0.0-dev placeholders, found version='${chart_version}' appVersion='${app_version}'."
            echo "The release stamps the real version from the tag at package time."
            exit 1
          fi
          echo "OK: Chart.yaml carries the 0.0.0-dev placeholders"

      - name: Log in to ghcr.io
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Package and push chart (version stamped from the tag)
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          helm package charts/crashcause -d dist --version "${version}" --app-version "${version}"
          helm push "dist/crashcause-${version}.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts"

  # The krew manifest is committed in placeholder form (never-matching
  # digests); the installable copy exists only as a release asset. This job
  # produces it: it takes the checksums goreleaser just published, stamps the
  # tag and digests via hack/krew-manifest.sh, and uploads the result as the
  # release's `crashcause.yaml` - the asset the README's
  # releases/latest/download/crashcause.yaml install line resolves to.
  # GITHUB_TOKEN is sufficient here: downloading and uploading release assets
  # is plain API usage, not event chaining, so no PAT is needed.
  krew:
    name: Publish krew manifest
    needs: goreleaser
    runs-on: ubuntu-latest
    permissions:
      contents: write  # upload the manifest as a release asset
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Rewrite the manifest from the release checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release download "${GITHUB_REF_NAME}" \
            --pattern 'crashcause_*_checksums.txt' --dir /tmp/krew
          chmod +x hack/krew-manifest.sh
          ./hack/krew-manifest.sh "${GITHUB_REF_NAME}" /tmp/krew/crashcause_*_checksums.txt

      # --clobber makes a re-run of this job overwrite the asset instead of
      # failing on "asset already exists".
      - name: Upload the manifest as a release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" deploy/krew/crashcause.yaml --clobber
