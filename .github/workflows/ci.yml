name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- lint: required, genuinely gating -------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # golangci-lint-action v9 supports golangci-lint v2 (v7+ of the action
      # dropped v1 support entirely). Our .golangci.yml uses the v2 config
      # schema ("version: \"2\""), so the pinned golangci-lint version below
      # MUST be a v2.x release.
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.12.2

  # --- test: required, genuinely gating -------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test (race + coverage)
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      # Informational only: coverage is reported, never enforced here (spec
      # §8a: report, don't hard-fail on a percentage). The empty-file branch
      # exists so a failed test run cannot turn into a confusing `go tool
      # cover` error on top of the real failure.
      - name: Coverage summary
        if: always()
        run: |
          if [ -s coverage.out ]; then
            go tool cover -func=coverage.out || echo "note: coverage.out had no usable data"
          else
            echo "note: coverage.out is empty or missing - the test step likely failed above"
          fi

      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: coverage-report
          path: coverage.out
          if-no-files-found: warn

  # --- build: required, genuinely gating (cross-compile only, no execution) -
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: arm64
    env:
      CGO_ENABLED: 0
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Cross-compile only - we cannot run darwin/arm64 binaries on a linux
      # runner, so this just proves the target compiles cleanly.
      - name: Cross-compile cmd/crashcause
        run: |
          mkdir -p /tmp/crashcause-build
          go build -o "/tmp/crashcause-build/crashcause-${GOOS}-${GOARCH}" ./cmd/crashcause

  # --- govulncheck: required, genuinely gating ------------------------------
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: golang/govulncheck-action@v1.1.0
        with:
          go-version-file: go.mod

  # --- helm: required and gating. charts/crashcause/ exists, so this really
  #     runs `helm lint` plus both `helm template` renders and enforces the
  #     severable-RBAC contract from spec §8: the `pods/log` rule is present by
  #     default and templated out of existence with logCollection.enabled=false
  #     (charts/crashcause/templates/rbac.yaml is the only place that string
  #     appears in the chart, so these greps cannot pass by accident).
  #     The directory guard is kept as a cheap invariant: if the chart ever
  #     disappears, the job says so instead of failing with a helm usage error.
  helm:
    name: Helm chart checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: azure/setup-helm@v5.0.1
        with:
          version: v4.2.3

      - name: helm lint / template guardrails
        run: |
          set -euo pipefail

          if [ ! -d charts/crashcause ]; then
            echo "FAIL: charts/crashcause is missing - the chart is part of the release contract"
            exit 1
          fi

          helm lint charts/crashcause

          echo "Rendering with default values (log collection enabled)..."
          helm template charts/crashcause > /tmp/rendered-default.yaml
          if ! grep -q "pods/log" /tmp/rendered-default.yaml; then
            echo "FAIL: expected the 'pods/log' RBAC verb in the default render, but it was not found"
            exit 1
          fi
          echo "OK: pods/log is present by default"

          echo "Rendering with logCollection.enabled=false..."
          helm template charts/crashcause --set logCollection.enabled=false > /tmp/rendered-nolog.yaml
          if grep -q "pods/log" /tmp/rendered-nolog.yaml; then
            echo "FAIL: 'pods/log' RBAC verb should be removed when logCollection.enabled=false, but it was found"
            exit 1
          fi
          echo "OK: pods/log is absent when logCollection.enabled=false"

  # --- e2e-kind: best effort only, never blocks the pipeline ----------------
  # Per spec §9 this job is explicitly non-gating (continue-on-error), because
  # it depends on a live cluster and on Docker Hub being reachable. It does,
  # however, make real assertions: hack/e2e.sh asserts the exact cause code and
  # exit code for every examples/kind-demo scenario plus a healthy control pod.
  # A red X here means a genuine classification regression worth reading.
  e2e-kind:
    name: E2E (kind, best effort)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build crashcause binary
        run: |
          mkdir -p bin
          CGO_ENABLED=0 go build -o bin/crashcause ./cmd/crashcause

      # kind-action passes --name explicitly, which overrides the `name:` field
      # inside kind-config.yaml - so cluster_name is set here to match it, and
      # the deletion step below can name the cluster deterministically.
      - name: Create kind cluster (using examples/kind-demo/kind-config.yaml)
        if: hashFiles('examples/kind-demo/kind-config.yaml') != ''
        uses: helm/kind-action@v1.14.0
        with:
          config: examples/kind-demo/kind-config.yaml
          cluster_name: crashcause-demo

      - name: Create kind cluster (default config fallback)
        if: hashFiles('examples/kind-demo/kind-config.yaml') == ''
        uses: helm/kind-action@v1.14.0
        with:
          cluster_name: crashcause-demo

      # jq is preinstalled on GitHub-hosted ubuntu runners; this step only
      # matters on self-hosted or slimmed-down images, where every assertion
      # in hack/e2e.sh would otherwise fail on a missing tool.
      - name: Ensure jq is installed
        run: |
          if command -v jq >/dev/null 2>&1; then
            echo "jq present: $(jq --version)"
          else
            sudo apt-get update && sudo apt-get install -y jq
          fi

      # The cluster already exists (created by kind-action above), so the
      # script runs without --create-cluster and leaves cluster lifecycle to
      # the job. CRASHCAUSE_BIN skips the in-script build.
      - name: Run e2e scenarios
        env:
          CRASHCAUSE_BIN: ${{ github.workspace }}/bin/crashcause
          E2E_TIMEOUT: "180"
        run: |
          chmod +x hack/e2e.sh
          ./hack/e2e.sh

      - name: Dump cluster state (debug)
        if: always()
        run: |
          echo "== kubectl get pods -A =="
          kubectl get pods -A || true
          echo "== kubectl describe pods -n crashcause-demo =="
          kubectl describe pods -n crashcause-demo || true
          echo "== kubectl get events -n crashcause-demo =="
          kubectl get events -n crashcause-demo --sort-by=.lastTimestamp || true

      - name: Delete kind cluster
        if: always()
        run: kind delete cluster --name crashcause-demo || true
